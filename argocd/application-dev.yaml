apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: carabia-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RoadToKnowledge/carabia-infra
    targetRevision:  ReleaseCarabia0079_
    path: kubernetes/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true