apiVersion: apps/v1
kind: Deployment
metadata:
  name: carabia-deployment
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: carabia
  template:
    metadata:
      labels:
        app: carabia
    spec:
      containers:
      - name: carabia-container
        image: 836479504031.dkr.ecr.eu-west-1.amazonaws.com/carabia-ecr:e81949c8df0ddab7dd4cc179f8eb9e9a6f101390
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: carabia-config
        - secretRef:
            name: carabia-secret
