apiVersion: apps/v1
kind: Deployment
metadata:
  name: carabia-deployment
  namespace: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: carabia
  template:
    metadata:
      labels:
        app: carabia
    spec:
      containers:
      - name: carabia-container
        image: 836479504031.dkr.ecr.eu-west-1.amazonaws.com/carabia-ecr:78a9e1be23f53ac4d7b7afb63ebf013bfce79e04
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: carabia-config
        - secretRef:
            name: carabia-secret