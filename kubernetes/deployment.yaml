apiVersion: apps/v1
kind: Deployment
metadata:
  name: carabia-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: carabia
  template:
    metadata:
      labels:
        app: carabia
    spec:
      containers:
      - name: carabia-container
        image: 836479504031.dkr.ecr.eu-north-1.amazonaws.com/carabia-ecr:af24faef155e1723a39c531a602b6a6ee23a6769
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: carabia-config
        - secretRef:
            name: carabia-secret
